<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Data Analyst Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0B10;
    --bg-2:#101219;
    --glass:rgba(255,255,255,0.045);
    --glass-hover:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --text:#F3F4F7;
    --text-muted:#8B90A0;
    --grad-1:#6366F1;
    --grad-2:#8B5CF6;
    --grad-3:#EC4899;
    --cyan:#22D3EE;
    --green:#34D399;
    --red:#F87171;
    --display:'Space Grotesk', 'Inter', sans-serif;
    --sans:'Inter', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --grad-btn:linear-gradient(135deg, var(--grad-1), var(--grad-2));
    --grad-text:linear-gradient(135deg, #A5B4FC, #C4B5FD, #F5B8DC);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    min-height:100vh;position:relative;overflow-x:hidden;
  }
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-glow span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;}
  .bg-glow span:nth-child(1){width:520px;height:520px;top:-180px;left:-120px;background:var(--grad-1);animation:drift1 22s ease-in-out infinite;}
  .bg-glow span:nth-child(2){width:460px;height:460px;top:200px;right:-160px;background:var(--grad-3);animation:drift2 26s ease-in-out infinite;}
  .bg-glow span:nth-child(3){width:380px;height:380px;bottom:-160px;left:30%;background:var(--cyan);opacity:.16;animation:drift1 30s ease-in-out infinite reverse;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,50px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,30px);}}
  @media (prefers-reduced-motion: reduce){.bg-glow span{animation:none !important;}}

  .app{max-width:900px;margin:0 auto;padding:40px 20px 100px;position:relative;z-index:1;}

  ::selection{background:var(--grad-2);color:#fff;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}

  .hdr{margin-bottom:30px;}
  .hdr .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .hdr .eyebrow .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.75);}}
  @media (prefers-reduced-motion: reduce){.pulse-dot{animation:none;}}
  .hdr h1{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-0.02em;margin:0 0 10px;
    background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hdr p{margin:0;color:var(--text-muted);font-size:15px;max-width:560px;line-height:1.6;}

  .connect-row{display:flex;gap:10px;margin-bottom:14px;}
  #backendUrl{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:0 16px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;height:48px;transition:border-color .2s, background .2s;}
  #backendUrl:focus{border-color:var(--grad-2);background:var(--glass-hover);}
  #connectBtn{background:var(--grad-btn);color:#fff;border:none;border-radius:10px;padding:0 24px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:var(--sans);height:48px;letter-spacing:.01em;
    transition:transform .18s ease, box-shadow .18s ease; box-shadow:0 4px 14px rgba(99,102,241,.25);}
  #connectBtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4);}
  #connectBtn:active{transform:translateY(0);}
  #connectBtn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .status-line{display:flex;align-items:center;gap:9px;margin:0 0 26px 2px;font-family:var(--mono);font-size:12px;color:var(--text-muted);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0;transition:background .3s, box-shadow .3s;}
  .status-dot.connecting{background:var(--cyan);animation:pulse 1s ease-in-out infinite;}
  .status-dot.ok{background:var(--green);box-shadow:0 0 10px var(--green);}
  .status-dot.err{background:var(--red);box-shadow:0 0 10px var(--red);}

  .panel{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:20px;
    animation:fadeUp .5s ease both;}
  .panel-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-size:11.5px;color:var(--text);transition:border-color .15s, background .15s;}
  .chip:hover{border-color:var(--grad-2);background:rgba(139,92,246,.08);}
  .chip b{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;}
  .schema-table{margin-bottom:16px;}
  .schema-table:last-child{margin-bottom:0;}
  .schema-table-name{font-family:var(--display);font-size:15px;color:var(--text);margin-bottom:8px;font-weight:600;}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--text-muted);font-weight:600;position:sticky;top:0;background:var(--bg-2);}

  .ask-row{display:flex;gap:10px;}
  #question{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-family:var(--sans);font-size:14.5px;outline:none;transition:border-color .2s, background .2s;}
  #question:focus{border-color:var(--grad-2);background:var(--glass-hover);}
  #question::placeholder{color:var(--text-muted);}
  #askBtn{background:var(--grad-btn);color:#fff;border:none;border-radius:10px;padding:0 26px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:var(--sans);
    transition:transform .18s ease, box-shadow .18s ease; box-shadow:0 4px 14px rgba(99,102,241,.25);}
  #askBtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(139,92,246,.4);}
  #askBtn:active{transform:translateY(0);}
  #askBtn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .example-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .ex-chip{background:transparent;border:1px dashed var(--border-strong);color:var(--text-muted);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .15s ease;}
  .ex-chip:hover{border-color:var(--cyan);color:var(--cyan);border-style:solid;transform:translateY(-1px);}

  .card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;margin-bottom:18px;overflow:hidden;
    animation:fadeUp .45s ease both; transition:border-color .2s, transform .2s;}
  .card:hover{border-color:var(--border-strong);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.card,.panel{animation:none;}}
  .card-q{padding:17px 22px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text-muted);display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
  .card-q .qtext b{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;font-family:var(--display);font-size:15px;}
  .card-q .serial{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);white-space:nowrap;letter-spacing:.05em;}
  .card-body{padding:20px 22px;}
  .insight{font-size:15px;line-height:1.65;margin-bottom:18px;color:var(--text);}

  .code-panel{background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:18px;}
  .code-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .verified-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#fff;
    background:linear-gradient(135deg, var(--green), #10B981);border-radius:20px;padding:5px 12px 5px 8px;box-shadow:0 0 14px rgba(52,211,153,.35);}
  .verified-badge svg{width:13px;height:13px;}
  .code-hdr .toggle{color:var(--text-muted);font-size:11px;font-family:var(--mono);}
  pre.code-body{margin:0;padding:15px;font-family:var(--mono);font-size:12px;line-height:1.6;color:#C7D2FE;overflow-x:auto;max-height:0;transition:max-height .25s ease;}
  pre.code-body.open{max-height:400px;overflow-y:auto;}
  @media (prefers-reduced-motion: reduce){pre.code-body{transition:none;}}

  .chart-wrap{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:10px;padding:18px;height:290px;position:relative;width:100%;
    animation:popIn .4s ease both .1s;}
  @keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){.chart-wrap{animation:none;}}
  .result-table-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:260px;}
  .raw-result{font-family:var(--mono);font-size:16px;font-weight:700;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:16px;
    background-image:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
  .error-card{border-color:rgba(248,113,113,.4);}
  .error-msg{font-family:var(--mono);font-size:12.5px;color:var(--red);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:13px 15px;}

  .loading{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-family:var(--mono);font-size:12.5px;padding:18px 22px;}
  .spinner-wrap{position:relative;width:18px;height:18px;flex-shrink:0;}
  .spinner-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, transparent, var(--grad-2), var(--cyan), transparent);animation:spin .9s linear infinite;}
  .spinner-mask{position:absolute;inset:3px;background:var(--bg-2);border-radius:50%;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner-ring{animation:none;background:var(--grad-2);}}

  .empty{color:var(--text-muted);font-size:14px;text-align:center;padding:56px 20px;}
  .history-hdr{display:flex;align-items:center;justify-content:space-between;margin:34px 0 14px;}
  .history-hdr span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--sans);font-size:11.5px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:all .15s;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--grad-1), var(--grad-3));border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:560px){
    .app{padding:28px 14px 80px;}
    .hdr h1{font-size:26px;}
    .connect-row,.ask-row{flex-direction:column;}
    #connectBtn,#askBtn{height:46px;}
    .card-q{flex-direction:column;gap:4px;}
    .bg-glow span{filter:blur(60px);}
  }
</style>
</head>
<body>
<div class="bg-glow"><span></span><span></span><span></span></div>
<div class="app">
  <div class="hdr">
    <div class="eyebrow"><span class="pulse-dot"></span>Live Data Agent</div>
    <h1>AI Data Analyst Agent</h1>
    <p>Connect to your backend, ask a question in plain English, get back verified SQL, an answer, and a chart.</p>
  </div>

  <div class="connect-row">
    <input type="text" id="backendUrl" value="" placeholder="http://localhost:8000" />
    <button id="connectBtn">Connect</button>
  </div>
  <div class="status-line"><span class="status-dot" id="statusDot"></span><span id="statusText">Not connected</span></div>

  <div id="schemaPanel" class="panel" style="display:none;">
    <div class="panel-title"><span>Schema</span><span id="tableCount"></span></div>
    <div id="schemaTables"></div>
  </div>

  <div id="askPanel" class="panel" style="display:none;">
    <div class="panel-title">Ask a question</div>
    <div class="ask-row">
      <input type="text" id="question" placeholder="e.g. What's the average order value by region?" />
      <button id="askBtn">Ask</button>
    </div>
    <div class="example-chips" id="exampleChips"></div>
  </div>

  <div id="historyHdrWrap" style="display:none;">
    <div class="history-hdr"><span>Log</span><button class="icon-btn" id="clearHistoryBtn">Clear log</button></div>
  </div>
  <div id="results"></div>
  <div id="emptyState" class="empty">Enter your backend URL and hit Connect to get started.</div>
</div>

<script>
let backendUrl = '';
let schema = [];
let entryNumber = 0;

const connectBtn = document.getElementById('connectBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

connectBtn.addEventListener('click', connectToBackend);
document.getElementById('backendUrl').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connectToBackend();
});

window.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('backendUrl');
  if (!input.value) {
    input.value = window.location.origin;
    connectToBackend();
  }
  loadHistory();
});

async function connectToBackend(){
  const url = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
  if (!url) return;
  connectBtn.disabled = true;
  setStatus('connecting', `Connecting to ${url}\u2026`);

  try {
    const res = await fetch(`${url}/schema`);
    if (!res.ok) throw new Error(`Backend returned ${res.status}`);
    const data = await res.json();
    if (!data.tables || !data.tables.length) throw new Error('Backend connected but reported no tables');

    backendUrl = url;
    schema = data.tables;
    setStatus('ok', `Connected \u2014 ${schema.length} table${schema.length === 1 ? '' : 's'} available`);
    renderSchema();
    renderExamples();
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('schemaPanel').style.display = 'block';
    document.getElementById('askPanel').style.display = 'block';
  } catch (err) {
    setStatus('err', `Couldn't connect: ${err.message}`);
  } finally {
    connectBtn.disabled = false;
  }
}

function setStatus(kind, text){
  statusDot.className = 'status-dot' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : kind === 'connecting' ? ' connecting' : '');
  statusText.textContent = text;
}

function renderSchema(){
  const wrap = document.getElementById('schemaTables');
  wrap.innerHTML = '';
  schema.forEach(t => {
    const block = document.createElement('div');
    block.className = 'schema-table';
    const chipsHtml = t.columns.map(c => `<div class="chip">${c.name} <b>${c.type}</b></div>`).join('');
    block.innerHTML = `<div class="schema-table-name">${t.table}</div><div class="chips">${chipsHtml}</div>`;
    wrap.appendChild(block);
  });
  document.getElementById('tableCount').textContent = `${schema.length} table${schema.length === 1 ? '' : 's'}`;
}

function renderExamples(){
  const firstTable = schema[0];
  if (!firstTable) return;
  const numCol = firstTable.columns.find(c => /int|real|float|double|numeric|decimal/i.test(c.type));
  const strCol = firstTable.columns.find(c => /char|text|string/i.test(c.type));
  const examples = [];
  if (numCol) examples.push(`What's the average ${numCol.name} in ${firstTable.table}?`);
  if (numCol && strCol) examples.push(`Show total ${numCol.name} by ${strCol.name}`);
  if (strCol) examples.push(`How many rows per ${strCol.name} in ${firstTable.table}?`);
  const wrap = document.getElementById('exampleChips');
  wrap.innerHTML = '';
  examples.forEach(q => {
    const b = document.createElement('button');
    b.className = 'ex-chip';
    b.textContent = q;
    b.onclick = () => { document.getElementById('question').value = q; askQuestion(); };
    wrap.appendChild(b);
  });
}

document.getElementById('askBtn').addEventListener('click', () => askQuestion());
document.getElementById('question').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') askQuestion();
});
document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

async function askQuestion(){
  const question = document.getElementById('question').value.trim();
  if (!question) return;
  document.getElementById('askBtn').disabled = true;

  const card = createLoadingCard(question);
  document.getElementById('results').appendChild(card);
  document.getElementById('historyHdrWrap').style.display = 'flex';
  card.scrollIntoView({ behavior: 'smooth', block: 'end' });

  try {
    const response = await fetch(`${backendUrl}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || `Backend returned ${response.status}`);
    if (typeof Chart === 'undefined') throw new Error('Charting library failed to load from CDN \u2014 try refreshing the page');

    const entry = {
      question, explanation: data.explanation, sql: data.sql,
      chartType: data.chart_type, rows: data.rows, ts: Date.now()
    };
    renderAnswerCard(card, entry);
    saveHistoryEntry(entry);
  } catch (err) {
    renderErrorCard(card, question, err.message || String(err));
  } finally {
    document.getElementById('askBtn').disabled = false;
  }
}

function createLoadingCard(question){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-q"><span class="qtext"><b>Q.</b> ${escapeHtml(question)}</span></div>
    <div class="loading"><div class="spinner-wrap"><div class="spinner-ring"></div><div class="spinner-mask"></div></div>Generating SQL and running it on the backend\u2026</div>`;
  return card;
}

function extractChartData(result){
  if (!Array.isArray(result) || result.length === 0) return null;
  if (typeof result[0] !== 'object' || result[0] === null) return null;

  const sample = result[0];
  const keys = Object.keys(sample);
  const labelKey = ['label', 'name', 'category', 'group', 'key'].find(k => k in sample) || keys[0];
  const valueKey = ['value', 'count', 'total', 'sum', 'amount', 'avg'].find(k => k in sample && k !== labelKey)
    || keys.find(k => k !== labelKey && typeof sample[k] === 'number')
    || keys.find(k => k !== labelKey);

  if (!labelKey || !valueKey) return null;

  const out = result.map(r => ({ label: String(r[labelKey]), value: Number(r[valueKey]) }))
    .filter(r => !isNaN(r.value));

  return out.length ? out : null;
}

const CHART_PALETTE = ['#6366F1', '#EC4899', '#22D3EE', '#34D399', '#F59E0B', '#F87171'];

function renderAnswerCard(card, entry){
  entryNumber++;
  const { question, explanation, sql, chartType, rows } = entry;
  const canvasId = `chart-${entryNumber}-${Date.now()}`;
  let resultHtml = '';

  const chartData = (chartType && chartType !== 'none') ? extractChartData(rows) : null;

  if (chartData && chartData.length) {
    resultHtml = `<div class="chart-wrap"><canvas id="${canvasId}"></canvas></div>`;
  } else if (chartType && chartType !== 'none') {
    resultHtml = `<div class="error-msg">The model returned a chart type but the result shape wasn't chartable, so showing the raw result instead:<br><span class="raw-result" style="display:inline-block;margin-top:8px;">${escapeHtml(JSON.stringify(rows))}</span></div>`;
  } else if (Array.isArray(rows)) {
    const keys = rows.length ? Object.keys(rows[0]) : [];
    resultHtml = `<div class="result-table-wrap"><table>
      <thead><tr>${keys.map(k => `<th>${k}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${keys.map(k => `<td>${r[k]}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  } else {
    resultHtml = `<div class="raw-result">${escapeHtml(String(rows))}</div>`;
  }

  const serial = String(entryNumber).padStart(3, '0');
  card.innerHTML = `
    <div class="card-q">
      <span class="qtext"><b>Q.</b> ${escapeHtml(question)}</span>
      <span class="serial">No. ${serial}</span>
    </div>
    <div class="card-body">
      <div class="insight">${escapeHtml(explanation)}</div>
      <div class="code-panel">
        <div class="code-hdr" onclick="this.nextElementSibling.classList.toggle('open'); this.querySelector('.toggle').textContent = this.nextElementSibling.classList.contains('open') ? 'hide \u25b2' : 'show \u25bc'">
          <span class="verified-badge"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>Verified</span>
          <span class="toggle">show \u25bc</span>
        </div>
        <pre class="code-body">${escapeHtml(sql)}</pre>
      </div>
      ${resultHtml}
    </div>
  `;

  if (chartData && chartData.length) {
    const ctx = document.getElementById(canvasId);
    const labels = chartData.map(r => r.label);
    const values = chartData.map(r => r.value);
    new Chart(ctx, {
      type: chartType === 'pie' ? 'pie' : chartType,
      data: {
        labels,
        datasets: [{
          label: 'value',
          data: values,
          backgroundColor: chartType === 'pie' ? CHART_PALETTE : 'rgba(139,92,246,0.75)',
          borderColor: chartType === 'line' ? '#8B5CF6' : 'rgba(255,255,255,0.1)',
          borderWidth: chartType === 'line' ? 2.5 : 1,
          borderRadius: chartType === 'bar' ? 6 : 0,
          tension: 0.35,
          pointBackgroundColor: '#EC4899',
          pointRadius: chartType === 'line' ? 4 : 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: { legend: { display: chartType === 'pie', labels: { color: '#8B90A0' } } },
        scales: chartType === 'pie' ? {} : {
          x: { ticks: { color: '#8B90A0' }, grid: { color: 'rgba(255,255,255,0.06)' } },
          y: { ticks: { color: '#8B90A0' }, grid: { color: 'rgba(255,255,255,0.06)' } }
        }
      }
    });
  }
}

function renderErrorCard(card, question, message){
  card.classList.add('error-card');
  card.innerHTML = `
    <div class="card-q"><span class="qtext"><b>Q.</b> ${escapeHtml(question)}</span></div>
    <div class="card-body">
      <div class="error-msg">Couldn't complete this analysis: ${escapeHtml(message)}. Try rephrasing the question.</div>
    </div>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- History (localStorage, best-effort -- never blocks core functionality) ---
const HISTORY_KEY = 'ada_history_v1';

function loadHistory(){
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  } catch (e) { /* storage unavailable or corrupt -- silently start empty */ }
  if (!history.length) return;

  document.getElementById('historyHdrWrap').style.display = 'flex';
  history.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'card';
    document.getElementById('results').appendChild(card);
    renderAnswerCard(card, entry);
  });
}

function saveHistoryEntry(entry){
  try {
    const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    history.push(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-50)));
  } catch (e) { /* best-effort only */ }
}

function clearHistory(){
  try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* ignore */ }
  document.getElementById('results').innerHTML = '';
  document.getElementById('historyHdrWrap').style.display = 'none';
  entryNumber = 0;
}
</script>
